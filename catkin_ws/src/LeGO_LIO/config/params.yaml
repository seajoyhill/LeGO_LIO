# Lightweight header-only logger. Supported levels, from most to least verbose:
# trace, debug, info, warn, error, fatal, off. {node} is replaced by the ROS node name.
# mapOptimization writes each scan-to-map correction to the configured file.
# {node} is replaced with the ROS node name, e.g. mapOptimization.
log:
  level: info
  file: /Users/sjh/src/LOAM/logs/lego_lio_{node}.log
  console: false
  append: true
  flush_level: warn

# LiDAR driver/model handler used by imageProjection.
# Current supported value: robosense32 (alias: rb32).
lidar_type: robosense32

# Lidar-to-IMU extrinsic calibration used by imageProjection.
# The transform is applied as: p_imu = R_lidar_to_imu * p_lidar + t_lidar_to_imu.
# Angles use ROS RPY order (roll, pitch, yaw) and are expressed in radians.
# Distances are expressed in metres.
lidar_to_imu:
  angle:
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
  distance:
    x: 0.27
    y: 0.0
    z: 0.20

# Local scan-to-map mapping and keyframe settings.
mappingProcessInterval: 0.3
surroundingKeyframeSearchRadius: 50.0
mappingCornerLeafSize: 0.2
mappingSurfLeafSize: 0.4
mappingOutlierLeafSize: 0.4

# RANSAC ground-plane normal constraint used by featureAssociation.
# The fit uses the deskewed points already labelled as ground by imageProjection.
ground_constraint:
  enabled: true
  ransac_iterations: 100
  ransac_min_inliers: 100
  ransac_min_inlier_ratio: 0.5
  ransac_distance_threshold: 0.05
  ransac_max_tilt_deg: 35.0
  distance_sigma: 0.05
  debug_log: true
  debug_log_every_n_frames: 1
